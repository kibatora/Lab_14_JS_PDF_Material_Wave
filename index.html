<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Resume</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- ===== Toolbar ===== -->
    <header class="toolbar no-print">
      <div class="toolbar-inner">
        <div class="brand">
          <div class="brand-mark ripple-container" data-ripple>CV</div>
          <div class="brand-text">
            <div class="brand-title">Interactive Resume</div>
            <div class="brand-sub">Click any text to edit · auto-saved</div>
          </div>
        </div>
        <div class="toolbar-actions">
          <button id="reset-btn" class="btn btn-secondary ripple-container" data-ripple>
            <!-- rotate-ccw -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon">
              <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>
            </svg>
            <span class="btn-label">Reset</span>
          </button>
          <button id="download-btn" class="btn btn-primary ripple-container" data-ripple>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            <span id="download-label">Download PDF</span>
          </button>
        </div>
      </div>
    </header>

    <!-- ===== Sheet ===== -->
    <main class="page fade-up">
      <div id="resume-sheet" class="sheet">
        <!-- Header band -->
        <section class="sheet-header">
          <div class="sheet-header-pattern" aria-hidden="true"></div>
          <div class="sheet-header-row">
            <div id="initials" class="avatar float-soft ripple-container" data-ripple>AM</div>
            <div class="sheet-header-text">
              <h1
                class="name editable-ripple"
                contenteditable="true"
                spellcheck="false"
                data-ripple
                data-bind="name"
                data-placeholder="Your name"
              ></h1>
              <p
                class="title editable-ripple"
                contenteditable="true"
                spellcheck="false"
                data-ripple
                data-bind="title"
                data-placeholder="Your title"
              ></p>
              <div class="contact-grid">
                <div class="contact">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-sky">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
                  </svg>
                  <span class="editable-ripple" contenteditable="true" spellcheck="false" data-ripple data-bind="location" data-placeholder="City, Country"></span>
                </div>
                <div class="contact">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-sky">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
                  </svg>
                  <span class="editable-ripple" contenteditable="true" spellcheck="false" data-ripple data-bind="email" data-placeholder="email@example.com"></span>
                </div>
                <div class="contact">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-sky">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                  </svg>
                  <span class="editable-ripple" contenteditable="true" spellcheck="false" data-ripple data-bind="phone" data-placeholder="+1 555 0100"></span>
                </div>
                <div class="contact">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-sky">
                    <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                  </svg>
                  <span class="editable-ripple" contenteditable="true" spellcheck="false" data-ripple data-bind="website" data-placeholder="yoursite.com"></span>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- Body -->
        <div class="sheet-body">
          <div class="col-main">
            <h2 class="section-title"><span class="section-bar"></span>Profile</h2>
            <p
              class="summary editable-ripple"
              contenteditable="true"
              spellcheck="false"
              data-ripple
              data-bind="summary"
              data-multiline="true"
              data-placeholder="Write a short summary…"
            ></p>

            <div>
              <div class="section-row">
                <h2 class="section-title"><span class="section-bar"></span>Experience</h2>
                <button id="add-exp" class="link-btn ripple-container no-print" data-ripple>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-sm"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                  Add
                </button>
              </div>
              <div id="experience-list" class="exp-list"></div>
            </div>

            <div>
              <div class="section-row">
                <h2 class="section-title"><span class="section-bar"></span>Education</h2>
                <button id="add-edu" class="link-btn ripple-container no-print" data-ripple>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-sm"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                  Add
                </button>
              </div>
              <div id="education-list" class="edu-list"></div>
            </div>
          </div>

          <aside class="col-side">
            <div>
              <h2 class="section-title"><span class="section-bar"></span>Skills</h2>
              <div id="skills-list" class="skills"></div>
            </div>

            <div>
              <div class="section-row">
                <h2 class="section-title"><span class="section-bar"></span>Languages</h2>
                <button id="add-lang" class="link-btn ripple-container no-print" data-ripple>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-sm"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                  Add
                </button>
              </div>
              <ul id="languages-list" class="languages"></ul>
            </div>

            <div class="tip no-print">
              <p class="tip-title">Tip</p>
              <p>Click any text to edit it. Your changes are saved to this browser automatically. Hit "Download PDF" to export.</p>
            </div>
          </aside>
        </div>
      </div>

      <footer class="footer no-print">Lab 14 · JS · PDF · Material Wave</footer>
    </main>

    <!-- ===== Toast ===== -->
    <div id="toast" class="toast no-print" hidden></div>

    <!-- ===== Templates ===== -->
    <template id="tpl-experience">
      <article class="exp-item" data-kind="experience">
        <div class="exp-dot"></div>
        <div class="exp-head">
          <div>
            <h3 class="exp-role editable-ripple" contenteditable="true" spellcheck="false" data-ripple data-field="role"></h3>
            <div class="exp-company editable-ripple" contenteditable="true" spellcheck="false" data-ripple data-field="company"></div>
          </div>
          <span class="exp-period editable-ripple" contenteditable="true" spellcheck="false" data-ripple data-field="period"></span>
        </div>
        <ul class="bullets" data-field="bullets"></ul>
        <button class="remove-btn no-print" data-action="remove-exp" aria-label="Remove experience">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-sm"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </article>
    </template>

    <template id="tpl-bullet">
      <li class="bullet">
        <span class="bullet-dot"></span>
        <span class="bullet-text editable-ripple" contenteditable="true" spellcheck="false" data-ripple data-multiline="true"></span>
        <button class="remove-btn-sm no-print" data-action="remove-bullet" aria-label="Remove bullet">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-sm"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </button>
      </li>
    </template>

    <template id="tpl-bullet-add">
      <li class="no-print">
        <button class="link-btn link-btn-sm ripple-container" data-action="add-bullet" data-ripple>+ Bullet</button>
      </li>
    </template>

    <template id="tpl-education">
      <article class="edu-item">
        <div>
          <h3 class="edu-degree editable-ripple" contenteditable="true" spellcheck="false" data-ripple data-field="degree"></h3>
          <div class="edu-school editable-ripple" contenteditable="true" spellcheck="false" data-ripple data-field="school"></div>
        </div>
        <div class="edu-right">
          <span class="edu-period editable-ripple" contenteditable="true" spellcheck="false" data-ripple data-field="period"></span>
          <button class="remove-btn no-print" data-action="remove-edu" aria-label="Remove education">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-sm"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          </button>
        </div>
      </article>
    </template>

    <template id="tpl-skill">
      <span class="skill ripple-container" data-ripple>
        <span class="skill-text editable-ripple" contenteditable="true" spellcheck="false" data-ripple></span>
        <button class="remove-btn-sm no-print" data-action="remove-skill" aria-label="Remove skill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-sm"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </span>
    </template>

    <template id="tpl-skill-add">
      <button class="skill-add ripple-container no-print" data-action="add-skill" data-ripple>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-sm"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Skill
      </button>
    </template>

    <template id="tpl-language">
      <li class="lang-item">
        <span class="lang-name editable-ripple" contenteditable="true" spellcheck="false" data-ripple data-field="name"></span>
        <div class="lang-right">
          <span class="lang-level editable-ripple" contenteditable="true" spellcheck="false" data-ripple data-field="level"></span>
          <button class="remove-btn-sm no-print" data-action="remove-lang" aria-label="Remove language">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-sm"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          </button>
        </div>
      </li>
    </template>

    <script src="app.js"></script>
  </body>
</html>
